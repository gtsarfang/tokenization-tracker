[theme]
# Dark on purpose: the metallic gold/silver gradients on the log bars and donuts
# only read as metal against a dark ground, and this is a dashboard people
# screenshot and share — dark frames travel better than a white page.
base = "dark"
primaryColor = "#d4af37"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#151a27"
textColor = "#e6e9ef"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
